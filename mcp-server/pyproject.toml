[project]
name = "blograg-mcp"
version = "0.1.0"
description = "Remote MCP server that lets an AI assistant write drafts on a BlogRAG portfolio — never delete."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.41.0",
]

[project.scripts]
blograg-mcp = "blograg_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blograg_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
